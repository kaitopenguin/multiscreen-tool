[package]
name = "multiscreen-tool"
version = "1.0.0"
edition = "2021"
authors = ["kaitopenguin"]
description = "A next-generation native Rust secondary monitor hub: hardware telemetry, virtual aquarium, model rotator, and low-RAM desktop companion."
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
sysinfo = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation"
] }
chrono = { version = "0.4", features = ["serde"] }
