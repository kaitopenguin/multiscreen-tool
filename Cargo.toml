[package]
name = "multiscreen-tool"
version = "1.0.0"
edition = "2021"
authors = ["kaitopenguin"]
description = "A next-generation secondary monitor hub: live video wallpaper, hardware telemetry, virtual aquarium, multi-model AI rotation, and customizable widgets."
license = "MIT"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
sysinfo = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation"] }
chrono = { version = "0.4", features = ["serde"] }
open = "5.3"
tracing = "0.1"
tracing-subscriber = "0.3"
