<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiscreen Tool - Secondary HUD</title>
  <link rel="stylesheet" href="src/css/impeccable-ios.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow-y: auto;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="theme-arch">

  <!-- Docked Sidebar HUD Container -->
  <div class="hud-wrapper">
    
    <!-- Arch Linux Hyprland / Waybar Header Pill Bar -->
    <header class="waybar-header">
      <div class="waybar-group-left">
        <div class="waybar-logo-pill">
          <div class="waybar-status-dot"></div>
          <span id="header-brand-tag">ARCH // WAYBAR</span>
        </div>
        <span class="waybar-action-chip" id="hdr-cpu-chip" title="CPU Load"> 15%</span>
        <span class="waybar-action-chip" id="hdr-mem-chip" title="RAM Usage"> 8.4G</span>
      </div>

      <div class="waybar-group-right">
        <!-- Theme Quick Selector -->
        <select id="hud-theme-select" class="waybar-select" title="Switch Theme">
          <option value="arch">Arch Linux</option>
          <option value="frutiger">Frutiger Aero</option>
          <option value="retro">Retro CRT</option>
          <option value="modern">Modern Slate</option>
        </select>

        <!-- Dock Position Controls -->
        <button id="btn-dock-left" class="waybar-action-chip" title="Dock Left Side (Treo bên trái)">◧</button>
        <button id="btn-dock-right" class="waybar-action-chip" title="Dock Right Side (Treo bên phải)">◨</button>
        <button id="btn-dock-full" class="waybar-action-chip" title="Full Width (Toàn màn hình)">⛶</button>

        <!-- Customize Widgets Button -->
        <button id="btn-edit-widgets" class="waybar-action-chip" title="Customize Widgets">✨</button>
      </div>
    </header>

    <!-- Modular Widget Bento Container -->
    <main id="bento-widget-container" class="widget-grid-container"></main>

  </div>

  <script src="src/js/fish-friend.js"></script>
  <script src="src/js/widget-manager.js"></script>
  <script src="src/js/secondary-hud.js"></script>
</body>
</html>
