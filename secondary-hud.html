<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caelestia Shell - Secondary Display HUD</title>
  <link rel="stylesheet" href="src/css/impeccable-ios.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow-y: auto;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="theme-catppuccin">

  <!-- Caelestia Floating Island HUD Container -->
  <div class="caelestia-hud-frame">
    
    <!-- Floating Waybar Pill Island -->
    <header class="caelestia-waybar-island">
      
      <!-- Left: Arch Logo & Workspaces & Stat Chips -->
      <div class="waybar-cluster">
        <div class="arch-brand-pill">
          <div class="arch-dot-pulse"></div>
          <span id="header-brand-tag">ARCH // CAELESTIA</span>
        </div>

        <div class="workspaces-pill">
          <span class="ws-dot active"></span>
          <span class="ws-dot"></span>
          <span class="ws-dot"></span>
        </div>

        <span class="waybar-chip-btn" id="hdr-cpu-chip" title="CPU Load"> 14%</span>
        <span class="waybar-chip-btn" id="hdr-mem-chip" title="RAM Usage">󰍛 8.4G</span>
      </div>

      <!-- Right: Omarchy Themes, Dock Controls & Customize -->
      <div class="waybar-cluster">
        <select id="hud-theme-select" class="theme-dropdown-select" title="Switch Omarchy Theme">
          <option value="catppuccin">Catppuccin Sherbet</option>
          <option value="tokyonight">Tokyo Night</option>
          <option value="amberbyte">Amberbyte</option>
          <option value="blueberry">Blueberry</option>
          <option value="rosepine">Rose Pine</option>
          <option value="gruvbox">Gruvbox Material</option>
          <option value="nordic">Nordic Frost</option>
        </select>

        <button id="btn-dock-left" class="waybar-chip-btn" title="Dock Left (Treo bên trái)">◧</button>
        <button id="btn-dock-right" class="waybar-chip-btn" title="Dock Right (Treo bên phải)">◨</button>
        <button id="btn-dock-full" class="waybar-chip-btn" title="Full Width (Toàn màn hình)">⛶</button>
        <button id="btn-edit-widgets" class="waybar-chip-btn" title="Customize Widgets">✨</button>
      </div>

    </header>

    <!-- Caelestia Modular Widget Stack -->
    <main id="bento-widget-container" class="caelestia-widget-list"></main>

  </div>

  <script src="src/js/fish-friend.js"></script>
  <script src="src/js/widget-manager.js"></script>
  <script src="src/js/secondary-hud.js"></script>
</body>
</html>
